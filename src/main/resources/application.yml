spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skillswap}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

server:
  port: ${PORT:8081}
  error:
    include-message: always

app:
  jwt-secret: "SkillSwapLocalDevSecretKey2026ABC123"
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed-demo: ${SEED_DEMO:false}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.cors: TRACE